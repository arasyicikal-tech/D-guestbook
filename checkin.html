body {

/* DG-CHECKIN-ELITE-UI — visual-only polish; scanner and Supabase logic untouched */
:root{--dg-forest:#18372c;--dg-forest-2:#23483a;--dg-gold:#c4a15b;--dg-gold-light:#f4ead3;--dg-paper:#f6f5f0;--dg-ink:#1d2923;--dg-muted:#7b827c;--dg-border:#e5e0d5}
html{background:var(--dg-paper);scroll-behavior:smooth}
body{min-height:100svh;padding:28px 16px;background:radial-gradient(ellipse at 50% -15%,#fff 0%,#f8f6ef 44%,#eeece4 100%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--dg-ink);align-items:flex-start}
.container{width:100%;max-width:540px;padding:28px 0 38px;margin:0 auto}
.brand{margin:0 auto 16px;color:var(--dg-forest);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:14px;letter-spacing:4px;font-weight:800}
.brand img{width:68px!important;height:68px!important;object-fit:contain;padding:9px;border:1px solid rgba(196,161,91,.65);border-radius:20px;background:linear-gradient(145deg,#fffdf8,#f3ead8);box-shadow:0 8px 24px rgba(42,52,43,.08)}

.subtitle{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:10px;letter-spacing:2.2px;font-weight:700;color:#9a7c40;margin-bottom:27px}
.card{position:relative;overflow:hidden;background:rgba(255,255,255,.91);border:1px solid var(--dg-border);border-radius:24px;padding:27px 20px;box-shadow:0 18px 48px rgba(34,49,39,.07),0 2px 8px rgba(34,49,39,.025)}
.card:before{content:"";display:block;position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#98733a,var(--dg-gold),#e8d7ad,var(--dg-gold))}
.qr-icon{display:flex;align-items:center;justify-content:center;width:54px;height:54px;margin:0 auto 15px;border:1px solid #ead9b4;border-radius:17px;background:var(--dg-gold-light);color:#8b6c31;font-size:28px}
.scan-title{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:21px;font-weight:750;letter-spacing:-.5px;color:var(--dg-forest);margin-bottom:8px}
.scan-text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--dg-muted);font-size:13px;line-height:1.7;margin-bottom:18px}
#qr-reader{max-width:100%!important;margin:22px auto!important;padding:13px!important;border:1px solid var(--dg-border)!important;border-radius:18px!important;background:#fff!important;box-shadow:0 8px 26px rgba(31,48,37,.045)!important;overflow:hidden}
#qr-reader video{border-radius:12px!important;object-fit:cover}

#qr-reader button:hover,button:hover{background:var(--dg-forest-2)!important;box-shadow:0 8px 18px rgba(24,55,44,.16)}
#qr-reader button:active,button:active{transform:scale(.985)}
input{width:100%;min-height:49px;padding:14px 15px;border:1px solid #dddcd3;border-radius:12px;background:#fff;font:inherit;font-size:15px;text-align:left;outline:none;margin-bottom:12px;transition:border-color .16s,box-shadow .16s}
input:focus{border-color:var(--dg-gold);box-shadow:0 0 0 3px rgba(196,161,91,.15)}

.category{display:inline-flex;align-items:center;justify-content:center;border:1px solid #e5d2a5;border-radius:999px;background:#faf3e3;color:#896b32;padding:7px 13px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:10px;letter-spacing:1.4px;font-weight:800}

@media(max-width:390px){body{padding:20px 13px}.container{padding-top:19px}.card{padding:23px 15px;border-radius:20px}h1{font-size:25px}.subtitle{letter-spacing:1.7px}#qr-reader{padding:8px!important}}

<div class="container">

  <h1>GUEST CHECK-IN</h1>

    DIGITAL WEDDING REGISTRATION
  </div>

  <div class="card">

    <div class="qr-icon" aria-hidden="true">⌁</div>

    <div class="scan-title">
      Scan QR Tamu
    </div>

    <div class="scan-text">
      Masukkan kode QR tamu untuk melakukan check-in.
    </div>

    <div id="qr-reader" style="width:100%; max-width:400px; margin:20px auto;"></div>

    

    <div id="result"></div>

  </div>

  <div class="footer">
    D’Guestbook
  </div>

</div>

<script>

  const SUPABASE_URL = "https://yeyckoekpqadrbvmetta.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_gMXd17AurWlX-OSSyqd-oA_rtkugfSN";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function findGuest(token) {

    const tokenValue = token?.trim();

    const result =
      document.getElementById("result");

    if (!tokenValue) {
      result.style.display = "block";
      result.innerHTML =
        `<div class="error">QR token belum dimasukkan.</div>`;
      return;
    }

    result.style.display = "block";
    result.innerHTML =
      `<div class="scan-text">Mencari data tamu...</div>`;

    const { data, error } =
      await supabaseClient.rpc(
        "check_in_guest_v2",
        {
          p_token: tokenValue
        }
      );

    if (error || !data || data.length === 0) {

      result.innerHTML =
        `<div class="error">
          QR tamu tidak ditemukan.
        </div>`;

      return;
    }

    const guest = data[0];

    result.innerHTML = `
      <div class="guest-card">

        <div class="guest-name">
          ${escapeHTML(guest.guest_name)}
        </div>

        <div class="category">
          ${escapeHTML(guest.category)}
        </div>

        <div class="info">
          Jumlah Tamu: <b>${guest.guest_count}</b><br>
          Meja: <b>${escapeHTML(guest.table_number || "-")}</b><br>
          Status: <b>${escapeHTML(guest.status)}</b>
        </div>

        <button onclick="confirmCheckIn('${guest.qr_token}')"
          KONFIRMASI HADIR
        </button>

        <div id="checkinMessage"></div>

      </div>
    `;
  }

  async function findGuest(token) {

  const tokenValue = token?.trim();
  const result = document.getElementById("result");

  if (!tokenValue) {
    result.style.display = "block";
    result.innerHTML = `
      <div class="error">
        QR token tidak valid.
      </div>
    `;
    return;
  }

  result.style.display = "block";
  result.innerHTML = `
    <div class="scan-text">
      Memproses check-in...
    </div>
  `;

  const { data, error } = await supabaseClient.rpc(
    "check_in_guest_v2",
    {
      p_token: tokenValue
    }
  );

  if (error) {
    console.error("Check-in error:", error);

    result.innerHTML = `
      <div class="error">
        Check-in gagal.
      </div>
    `;
    return;
  }

  if (!data) {
    result.innerHTML = `
      <div class="error">
        QR tamu tidak ditemukan.
      </div>
    `;
    return;
  }

  const guest = data;
console.log("HASIL CHECK-IN:", guest);
if (guest.status === "already_checked_in") {
  result.innerHTML = `
    <div class="error">
      ⚠ TAMU SUDAH CHECK-IN
      <br><br>
      <strong>${escapeHTML(guest.guest_name)}</strong>
      <br>
      Tamu ini sudah melakukan check-in sebelumnya.
    </div>
  `;
  return;
}

result.innerHTML = `
  <div class="success">
    ✓ TAMU BERHASIL CHECK-IN
    <br><br>
    <strong>${escapeHTML(guest.guest_name)}</strong>
    <br>
    Jumlah tamu: ${guest.guest_count}
  </div>
`;
}


function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text ?? "";

  return div.innerHTML;
}
// QR SCANNER
  (function () {

  const reader = document.getElementById("qr-reader");

  if (!reader) {
    return;
  }

  if (typeof Html5QrcodeScanner === "undefined") {
    reader.innerHTML = `
      <div class="error">
        QR Scanner gagal dimuat.
      </div>
    `;
    return;
  }

  function onScanSuccess(decodedText) {
    findGuest(decodedText);

    html5QrcodeScanner.clear().catch(() => {});
  }

  function onScanFailure(error) {
    // Abaikan error scan sementara
  }

  const html5QrcodeScanner = new Html5QrcodeScanner(
    "qr-reader",
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      },
      rememberLastUsedCamera: true
    },
    false
  );

  html5QrcodeScanner.render(
    onScanSuccess,
    onScanFailure
  );

})();
</script>
