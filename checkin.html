<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f3ec;
      color: #332b24;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .brand {
      font-size: 14px;
      letter-spacing: 6px;
      margin-bottom: 12px;
    }

    .gold-line {
      width: 70px;
      height: 1px;
      background: #b08a4a;
      margin: 0 auto 28px;
    }

    h1 {
      font-size: 32px;
      font-weight: 400;
      margin: 0 0 8px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #8a7760;
      margin-bottom: 30px;
    }

    .card {
      background: #fffdf9;
      border: 1px solid rgba(176,138,74,.35);
      padding: 30px 24px;
      box-shadow: 0 15px 45px rgba(70,55,35,.10);
    }

    .qr-icon {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .scan-title {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .scan-text {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #7d7063;
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #d7c8ae;
      background: #fff;
      font-size: 15px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
    }

    input:focus {
      border-color: #b08a4a;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      background: #b08a4a;
      color: white;
      font-size: 13px;
      letter-spacing: 3px;
      cursor: pointer;
    }

    button:active {
      opacity: .8;
    }

    #result {
      margin-top: 22px;
      display: none;
    }

    .guest-card {
      border-top: 1px solid #d7c8ae;
      padding-top: 22px;
    }

    .guest-name {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .category {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid #b08a4a;
      color: #9a7438;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    .info {
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.8;
      color: #65594d;
      margin-bottom: 20px;
    }

    .success {
      color: #55704f;
      font-family: Arial, sans-serif;
      font-size: 13px;
      margin-top: 15px;
    }

    .error {
      color: #9b3d35;
      font-family: Arial, sans-serif;
      font-size: 13px;
      margin-top: 15px;
    }

    .footer {
      margin-top: 25px;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      color: #9a8b78;
    }
    /* ===== D'GUESTBOOK PREMIUM CHECK-IN ===== */

body {
  background:
    radial-gradient(circle at top, #fffdf8 0%, #f4efe6 45%, #e9e1d4 100%);
  color: #3f3832;
}

.container {
  max-width: 520px;
  margin: 0 auto;
  padding: 42px 20px 35px;
}

.brand {
  font-family: Georgia, serif;
  font-size: 18px;
  letter-spacing: 7px;
  text-transform: uppercase;
  color: #9a8567;
}

.gold-line {
  width: 70px;
  height: 2px;
  margin: 16px auto 30px;
  background: linear-gradient(
    90deg,
    transparent,
    #b08d4f,
    transparent
  );
}

h1 {
  font-family: Georgia, serif;
  font-size: 34px;
  letter-spacing: 4px;
  font-weight: 500;
  margin-bottom: 10px;
}

.subtitle {
  color: #9a8b78;
  letter-spacing: 2px;
  font-size: 13px;
}

#qr-reader {
  margin: 35px auto !important;
  padding: 18px !important;
  background: rgba(255,255,255,.75);
  border: 1px solid #d8c7a0 !important;
  border-radius: 18px !important;
  box-shadow: 0 18px 45px rgba(75,60,40,.10);
}

#qr-reader__dashboard {
  margin-top: 15px;
}

#qr-reader button {
  border: 0 !important;
  border-radius: 10px !important;
  padding: 12px 18px !important;
  background: #b08d4f !important;
  color: white !important;
  font-size: 14px !important;
}

#result {
  margin-top: 25px;
}

.success,
.error {
  border-radius: 16px !important;
  padding: 28px 20px !important;
  box-shadow: 0 15px 40px rgba(70,55,35,.10);
}

.success {
  background: rgba(248,252,247,.95) !important;
  border: 1px solid #b8cdb5 !important;
  color: #4d704b !important;
}

.error {
  background: #fff8f7 !important;
  border: 1px solid #d9aaa4 !important;
}

.scan-text {
  color: #8d8174;
  line-height: 1.6;
}

.footer {
  margin-top: 35px;
  font-family: Georgia, serif;
  letter-spacing: 5px;
  color: #9a8b78;
}
    /* ===== PREMIUM HEADER POLISH ===== */

h1 {
  font-size: clamp(27px, 7vw, 34px);
  letter-spacing: 3px;
  white-space: nowrap;
  text-align: center;
  line-height: 1.2;
  margin: 0 auto 14px;
}

.brand {
  font-size: 17px;
  letter-spacing: 6px;
}

.subtitle {
  font-size: 12px;
  letter-spacing: 2.5px;
  text-align: center;
}

.container {
  padding-top: 48px;
}

.gold-line {
  margin-top: 14px;
  margin-bottom: 28px;
}

@media (max-width: 380px) {
  h1 {
    font-size: 25px;
    letter-spacing: 2px;
  }
}
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
  <img
    src="dg-logo.png"
    alt="DG"
    style="width:90px; height:auto;"
  >
</div>
  <div class="gold-line"></div>

  <h1>GUEST CHECK-IN</h1>

  <div class="subtitle">
    DIGITAL WEDDING REGISTRATION
  </div>

  <div class="card">

    <div class="qr-icon">⌗</div>

    <div class="scan-title">
      Scan QR Tamu
    </div>

    <div class="scan-text">
      Masukkan kode QR tamu untuk melakukan check-in.
    </div>

    <div id="qr-reader" style="width:100%; max-width:400px; margin:20px auto;"></div>

    

    <div id="result"></div>

  </div>

  <div class="footer">
    D’Guestbook
  </div>

</div>

<script>

  const SUPABASE_URL = "https://yeyckoekpqadrbvmetta.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_gMXd17AurWlX-OSSyqd-oA_rtkugfSN";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function findGuest(token) {

    const tokenValue = token?.trim();

    const result =
      document.getElementById("result");

    if (!tokenValue) {
      result.style.display = "block";
      result.innerHTML =
        `<div class="error">QR token belum dimasukkan.</div>`;
      return;
    }

    result.style.display = "block";
    result.innerHTML =
      `<div class="scan-text">Mencari data tamu...</div>`;

    const { data, error } =
      await supabaseClient.rpc(
        "check_in_guest_v2",
        {
          p_token: tokenValue
        }
      );

    if (error || !data || data.length === 0) {

      result.innerHTML =
        `<div class="error">
          QR tamu tidak ditemukan.
        </div>`;

      return;
    }

    const guest = data[0];

    result.innerHTML = `
      <div class="guest-card">

        <div class="guest-name">
          ${escapeHTML(guest.guest_name)}
        </div>

        <div class="category">
          ${escapeHTML(guest.category)}
        </div>

        <div class="info">
          Jumlah Tamu: <b>${guest.guest_count}</b><br>
          Meja: <b>${escapeHTML(guest.table_number || "-")}</b><br>
          Status: <b>${escapeHTML(guest.status)}</b>
        </div>

        <button onclick="confirmCheckIn('${guest.qr_token}')"
          KONFIRMASI HADIR
        </button>

        <div id="checkinMessage"></div>

      </div>
    `;
  }

  async function findGuest(token) {

  const tokenValue = token?.trim();
  const result = document.getElementById("result");

  if (!tokenValue) {
    result.style.display = "block";
    result.innerHTML = `
      <div class="error">
        QR token tidak valid.
      </div>
    `;
    return;
  }

  result.style.display = "block";
  result.innerHTML = `
    <div class="scan-text">
      Memproses check-in...
    </div>
  `;

  const { data, error } = await supabaseClient.rpc(
    "check_in_guest",
    {
      p_token: tokenValue
    }
  );

  if (error) {
    console.error("Check-in error:", error);

    result.innerHTML = `
      <div class="error">
        Check-in gagal.
      </div>
    `;
    return;
  }

  if (!data || data.length === 0) {
    result.innerHTML = `
      <div class="error">
        QR tamu tidak ditemukan.
      </div>
    `;
    return;
  }

  const guest = data[0];

  result.innerHTML = `
    <div class="success">
      ✓ TAMU BERHASIL CHECK-IN
      <br><br>
      <strong>${escapeHTML(guest.guest_name)}</strong>
      <br>
      Jumlah tamu: ${guest.guest_count}
    </div>
  `;
}


function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text ?? "";

  return div.innerHTML;
}
// QR SCANNER
  (function () {

  const reader = document.getElementById("qr-reader");

  if (!reader) {
    return;
  }

  if (typeof Html5QrcodeScanner === "undefined") {
    reader.innerHTML = `
      <div class="error">
        QR Scanner gagal dimuat.
      </div>
    `;
    return;
  }

  function onScanSuccess(decodedText) {
    findGuest(decodedText);

    html5QrcodeScanner.clear().catch(() => {});
  }

  function onScanFailure(error) {
    // Abaikan error scan sementara
  }

  const html5QrcodeScanner = new Html5QrcodeScanner(
    "qr-reader",
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      },
      rememberLastUsedCamera: true
    },
    false
  );

  html5QrcodeScanner.render(
    onScanSuccess,
    onScanFailure
  );

})();
</script>

</body>
</html>
